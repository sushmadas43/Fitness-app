<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APEX — Loading</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Barlow:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body { background: #050810; }

  /* ── Background grid ── */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #050810;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0;
    transition: opacity 0.8s ease, visibility 0.8s ease;
    overflow: hidden;
  }
  #loader.hidden { opacity: 0; visibility: hidden; }

  /* grid lines */
  #loader::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(180,240,58,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(180,240,58,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* ambient glow blob */
  .loader-glow {
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(180,240,58,0.12) 0%, transparent 70%);
    border-radius: 50%;
    pointer-events: none;
    animation: glow-pulse 3s ease-in-out infinite;
  }
  @keyframes glow-pulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50%       { transform: scale(1.15); opacity: 1; }
  }

  /* ── Logo wrapper ── */
  .loader-brand {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    animation: brand-in 0.9s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes brand-in {
    from { opacity: 0; transform: translateY(24px) scale(0.92); }
    to   { opacity: 1; transform: none; }
  }

  /* eyebrow line */
  .loader-eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
  }
  .loader-eyebrow-line {
    width: 32px; height: 1.5px;
    background: linear-gradient(90deg, transparent, #b4f03a);
  }
  .loader-eyebrow-line.right {
    background: linear-gradient(90deg, #b4f03a, transparent);
  }
  .loader-eyebrow-text {
    font-family: 'Barlow', sans-serif;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: rgba(180,240,58,0.7);
  }

  /* APEX text */
  .loader-logo {
    font-family: 'Black Ops One', 'Impact', sans-serif;
    font-size: clamp(5rem, 14vw, 9rem);
    font-weight: 400; /* Black Ops One is inherently ultra-bold */
    letter-spacing: 0.08em;
    line-height: 1;
    color: #ffffff;
    /* layered text-shadow for depth + green glow */
    text-shadow:
      0 0 40px rgba(180,240,58,0.45),
      0 0 80px rgba(180,240,58,0.2),
      4px 4px 0px rgba(0,0,0,0.5);
    position: relative;
  }

  /* green accent underline on APEX */
  .loader-logo::after {
    content: '';
    display: block;
    height: 4px;
    width: 100%;
    background: linear-gradient(90deg, #b4f03a, #3af0c8);
    border-radius: 2px;
    margin-top: 6px;
    box-shadow: 0 0 16px rgba(180,240,58,0.6);
    animation: underline-in 1s 0.4s cubic-bezier(0.16,1,0.3,1) both;
  }
  @keyframes underline-in {
    from { transform: scaleX(0); opacity: 0; }
    to   { transform: scaleX(1); opacity: 1; }
  }

  /* tagline */
  .loader-tagline {
    font-family: 'Barlow', sans-serif;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.3);
    margin-top: 10px;
    animation: fade-up 0.8s 0.5s ease both;
  }
  @keyframes fade-up {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: none; }
  }

  /* ── Progress bar ── */
  .loader-progress {
    position: relative;
    z-index: 2;
    margin-top: 48px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    animation: fade-up 0.6s 0.3s ease both;
  }

  .loader-bar-wrap {
    width: 220px;
    height: 2px;
    background: rgba(255,255,255,0.07);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }

  .loader-bar {
    height: 100%;
    background: linear-gradient(90deg, #b4f03a, #3af0c8);
    border-radius: 2px;
    animation: loader-bar 2s cubic-bezier(0.4,0,0.2,1) forwards;
    box-shadow: 0 0 12px rgba(180,240,58,0.7);
  }
  @keyframes loader-bar { from { width: 0 } to { width: 100% } }

  /* shimmer on bar */
  .loader-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.4) 50%, transparent 100%);
    animation: shimmer 1.5s 0.3s ease infinite;
  }
  @keyframes shimmer {
    from { transform: translateX(-100%); }
    to   { transform: translateX(300%); }
  }

  .loader-status {
    font-family: 'Barlow', sans-serif;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: rgba(180,240,58,0.5);
  }

  /* ── Corner accents ── */
  .corner {
    position: absolute;
    width: 28px; height: 28px;
    z-index: 2;
    opacity: 0.4;
  }
  .corner-tl { top: 32px; left: 32px; border-top: 1.5px solid #b4f03a; border-left: 1.5px solid #b4f03a; }
  .corner-tr { top: 32px; right: 32px; border-top: 1.5px solid #b4f03a; border-right: 1.5px solid #b4f03a; }
  .corner-bl { bottom: 32px; left: 32px; border-bottom: 1.5px solid #b4f03a; border-left: 1.5px solid #b4f03a; }
  .corner-br { bottom: 32px; right: 32px; border-bottom: 1.5px solid #b4f03a; border-right: 1.5px solid #b4f03a; }
</style>
</head>
<body>

<div id="loader">

  <!-- ambient glow -->
  <div class="loader-glow"></div>

  <!-- corner brackets -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- brand -->
  <div class="loader-brand">
    <div class="loader-eyebrow">
      <div class="loader-eyebrow-line"></div>
      <span class="loader-eyebrow-text">Performance Lab</span>
      <div class="loader-eyebrow-line right"></div>
    </div>
    <div class="loader-logo">APEX</div>
    <div class="loader-tagline">Elevate Your Performance</div>
  </div>

  <!-- progress -->
  <div class="loader-progress">
    <div class="loader-bar-wrap">
      <div class="loader-bar"></div>
    </div>
    <span class="loader-status" id="loaderStatus">Initializing...</span>
  </div>

</div>

<script>
  /* Status text cycling */
  const statuses = ['Initializing...', 'Loading Assets...', 'Almost Ready...'];
  let i = 0;
  const statusEl = document.getElementById('loaderStatus');
  const interval = setInterval(() => {
    i++;
    if (i < statuses.length) statusEl.textContent = statuses[i];
    else clearInterval(interval);
  }, 600);

  /* Hide loader after 2s */
  window.addEventListener('load', () => {
    setTimeout(() => {
      document.getElementById('loader').classList.add('hidden');
    }, 2000);
  });
</script>

</body>
</html>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>APEX FITNESS — Workout Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #050810;
  --bg2: #0a0f1e;
  --bg3: #0f1628;
  --card: rgba(255,255,255,0.04);
  --card-hover: rgba(255,255,255,0.07);
  --green: #b4f03a;
  --blue: #3af0c8;
  --red: #f03a6e;
  --purple: #a03af0;
  --orange: #f0943a;
  --text: #f0f4ff;
  --text2: #8896b3;
  --text3: #4a5568;
  --border: rgba(255,255,255,0.07);
  --border-g: rgba(180,240,58,0.25);
  --glow: 0 0 28px rgba(180,240,58,0.2);
  --r: 14px;
  --r-sm: 8px;
  --disp: 'Bebas Neue', Impact, sans-serif;
  --body: 'DM Sans', 'Segoe UI', sans-serif;
  --nav: 64px;
  --trans: 0.25s cubic-bezier(0.4,0,0.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--body);min-height:100vh;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,select,textarea{font-family:inherit;outline:none}
ul{list-style:none}
a{text-decoration:none;color:inherit}

/* ── Grid bg ── */
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(180,240,58,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(180,240,58,0.03) 1px,transparent 1px);
  background-size:56px 56px;
}

/* ── NAV ── */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;height:var(--nav);
  display:flex;align-items:center;padding:0 5%;gap:24px;
  background:rgba(5,8,16,0.8);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
}
.nav-logo{font-family:var(--disp);font-size:1.7rem;letter-spacing:.12em;color:var(--green);text-shadow:0 0 20px rgba(180,240,58,.4)}
.nav-logo span{color:var(--text)}
.nav-sub{font-size:.72rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-top:2px}
.nav-sep{flex:1}
.nav-stat{text-align:center;padding:6px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm)}
.nav-stat-val{font-family:var(--disp);font-size:1.3rem;letter-spacing:.05em;color:var(--green);line-height:1}
.nav-stat-lbl{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.1em}

/* ── LAYOUT ── */
main{padding-top:calc(var(--nav)+32px);padding-bottom:60px;padding-left:5%;padding-right:5%;max-width:1300px;margin:0 auto;position:relative;z-index:1}

/* ── HEADER BLOCK ── */
.page-header{margin-bottom:40px}
.page-eyebrow{display:inline-flex;align-items:center;gap:10px;margin-bottom:12px}
.eyebrow-line{width:32px;height:2px;background:var(--green)}
.eyebrow-txt{font-size:.72rem;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--green)}
.page-title{font-family:var(--disp);font-size:clamp(2.8rem,6vw,5rem);letter-spacing:.05em;line-height:.95;margin-bottom:8px}
.page-title span{color:var(--green)}
.page-desc{font-size:.95rem;color:var(--text2);max-width:500px}

/* ── TOOLBAR ── */
.toolbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  margin-bottom:28px;
  padding:20px 24px;
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.9rem;pointer-events:none;color:var(--text3)}
.search-input{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:10px 14px 10px 38px;
  color:var(--text);font-size:.9rem;transition:border-color var(--trans),box-shadow var(--trans);
}
.search-input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(180,240,58,.1)}
.search-input::placeholder{color:var(--text3)}
.filter-select{
  background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:var(--r-sm);
  padding:10px 14px;color:var(--text);font-size:.85rem;cursor:pointer;
  transition:border-color var(--trans);
}
.filter-select:focus{border-color:var(--green)}
.filter-select option{background:var(--bg2)}
.btn-add{
  display:flex;align-items:center;gap:8px;
  padding:10px 22px;background:var(--green);color:#050810;
  border-radius:var(--r-sm);font-weight:700;font-size:.85rem;
  letter-spacing:.06em;text-transform:uppercase;
  transition:all var(--trans);box-shadow:0 0 18px rgba(180,240,58,.3);
  white-space:nowrap;
}
.btn-add:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(180,240,58,.5)}
.btn-add span{font-size:1.1rem;font-weight:400}

/* ── EMPTY STATE ── */
.empty-state{
  text-align:center;padding:80px 20px;
  background:var(--card);border:1px dashed var(--border);border-radius:var(--r);
}
.empty-icon{font-size:3.5rem;margin-bottom:16px;opacity:.5}
.empty-title{font-family:var(--disp);font-size:1.8rem;letter-spacing:.06em;color:var(--text2);margin-bottom:8px}
.empty-sub{font-size:.9rem;color:var(--text3);margin-bottom:24px}

/* ── WORKOUT GRID ── */
.workouts-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
  gap:20px;
}

/* ── WORKOUT CARD ── */
.workout-card{
  background:var(--card);border:1px solid var(--border);border-radius:var(--r);
  overflow:hidden;transition:all var(--trans);position:relative;
  display:flex;flex-direction:column;
}
.workout-card:hover{border-color:var(--border-g);transform:translateY(-4px);box-shadow:var(--glow)}
.wc-stripe{height:3px;width:100%}
.stripe-push   {background:linear-gradient(90deg,var(--green),var(--blue))}
.stripe-pull   {background:linear-gradient(90deg,var(--blue),var(--purple))}
.stripe-legs   {background:linear-gradient(90deg,var(--red),var(--orange))}
.stripe-cardio {background:linear-gradient(90deg,var(--orange),var(--green))}
.stripe-other  {background:linear-gradient(90deg,var(--purple),var(--blue))}

.wc-body{padding:22px 22px 16px;flex:1}
.wc-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.wc-type-badge{
  font-size:.65rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  padding:3px 10px;border-radius:100px;
}
.badge-push   {background:rgba(180,240,58,.1);color:var(--green);border:1px solid rgba(180,240,58,.25)}
.badge-pull   {background:rgba(58,240,200,.1);color:var(--blue);border:1px solid rgba(58,240,200,.25)}
.badge-legs   {background:rgba(240,58,110,.1);color:var(--red);border:1px solid rgba(240,58,110,.25)}
.badge-cardio {background:rgba(240,148,58,.1);color:var(--orange);border:1px solid rgba(240,148,58,.25)}
.badge-other  {background:rgba(160,58,240,.1);color:var(--purple);border:1px solid rgba(160,58,240,.25)}

.wc-date{font-size:.72rem;color:var(--text3);margin-left:auto}
.wc-title{font-family:var(--disp);font-size:1.6rem;letter-spacing:.05em;margin-bottom:6px;line-height:1.1}
.wc-notes{font-size:.85rem;color:var(--text2);line-height:1.6;margin-bottom:16px;min-height:40px}

.wc-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.wc-stat{
  display:flex;flex-direction:column;align-items:center;
  padding:8px 14px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:var(--r-sm);flex:1;min-width:72px;
}
.wc-stat-val{font-family:var(--disp);font-size:1.2rem;letter-spacing:.05em;color:var(--green);line-height:1}
.wc-stat-lbl{font-size:.62rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-top:2px}

.wc-exercises{margin-bottom:4px}
.wc-ex-title{font-size:.7rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.wc-ex-list{display:flex;flex-direction:column;gap:4px}
.wc-ex-item{
  display:flex;align-items:center;justify-content:space-between;
  padding:5px 10px;background:rgba(255,255,255,0.03);
  border-radius:6px;font-size:.8rem;
}
.wc-ex-name{color:var(--text2)}
.wc-ex-detail{font-size:.72rem;color:var(--text3);font-family:monospace}

.wc-footer{
  display:flex;gap:8px;padding:12px 16px;
  border-top:1px solid var(--border);
}
.btn-edit,.btn-delete{
  display:flex;align-items:center;gap:5px;padding:7px 14px;
  border-radius:var(--r-sm);font-size:.78rem;font-weight:600;
  letter-spacing:.04em;transition:all var(--trans);
}
.btn-edit{
  border:1px solid var(--border);color:var(--text2);flex:1;justify-content:center;
}
.btn-edit:hover{border-color:var(--green);color:var(--green);background:rgba(180,240,58,.06)}
.btn-delete{
  border:1px solid var(--border);color:var(--text3);
}
.btn-delete:hover{border-color:var(--red);color:var(--red);background:rgba(240,58,110,.06)}

/* ── MODAL OVERLAY ── */
.modal-overlay{
  position:fixed;inset:0;z-index:200;
  background:rgba(5,8,16,.85);backdrop-filter:blur(12px);
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity var(--trans);
}
.modal-overlay.open{opacity:1;pointer-events:all}

.modal{
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);
  width:100%;max-width:560px;max-height:90vh;overflow-y:auto;
  transform:translateY(24px) scale(.98);transition:transform var(--trans);
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.modal-overlay.open .modal{transform:none}

.modal-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:24px 28px 0;margin-bottom:24px;
}
.modal-title{font-family:var(--disp);font-size:2rem;letter-spacing:.06em}
.modal-close{
  width:36px;height:36px;border-radius:50%;
  background:var(--card);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:1rem;color:var(--text2);transition:all var(--trans);
}
.modal-close:hover{border-color:var(--red);color:var(--red)}

.modal-body{padding:0 28px 28px}

.form-group{margin-bottom:18px}
.form-label{
  display:block;font-size:.72rem;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text2);margin-bottom:7px;
}
.form-input,.form-select,.form-textarea{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:var(--r-sm);padding:11px 14px;color:var(--text);font-size:.9rem;
  transition:border-color var(--trans),box-shadow var(--trans);
}
.form-input:focus,.form-select:focus,.form-textarea:focus{
  border-color:var(--green);box-shadow:0 0 0 3px rgba(180,240,58,.1);
}
.form-input::placeholder,.form-textarea::placeholder{color:var(--text3)}
.form-select{cursor:pointer}
.form-select option{background:var(--bg2)}
.form-textarea{resize:vertical;min-height:80px;line-height:1.5}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* exercises section in modal */
.ex-section{margin-bottom:18px}
.ex-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ex-section-title{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--text2)}
.btn-add-ex{
  display:flex;align-items:center;gap:4px;font-size:.72rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--green);
  padding:4px 10px;border:1px solid var(--border-g);border-radius:6px;
  transition:all var(--trans);
}
.btn-add-ex:hover{background:rgba(180,240,58,.08)}
.ex-inputs{display:flex;flex-direction:column;gap:8px}
.ex-row{
  display:grid;grid-template-columns:1fr 70px 70px auto;gap:8px;align-items:center;
  background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 10px;
}
.ex-row input{background:transparent;border:none;color:var(--text);font-size:.85rem;padding:2px 0;border-bottom:1px solid var(--border);transition:border-color var(--trans)}
.ex-row input:focus{border-bottom-color:var(--green)}
.ex-row input::placeholder{color:var(--text3);font-size:.8rem}
.btn-rm-ex{color:var(--text3);font-size:.85rem;transition:color var(--trans);padding:2px 6px;border-radius:4px}
.btn-rm-ex:hover{color:var(--red)}

.modal-footer{display:flex;gap:10px;padding:0 28px 28px}
.btn-save{
  flex:1;padding:13px;background:var(--green);color:#050810;
  border-radius:var(--r-sm);font-weight:800;font-size:.9rem;
  letter-spacing:.08em;text-transform:uppercase;
  transition:all var(--trans);box-shadow:0 0 18px rgba(180,240,58,.25);
}
.btn-save:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(180,240,58,.4)}
.btn-cancel{
  padding:13px 22px;border:1px solid var(--border);border-radius:var(--r-sm);
  color:var(--text2);font-size:.85rem;font-weight:600;transition:all var(--trans);
